# ── Task ──────────────────────────────────────────────────────────────────────

exp_name: TDMPC_reduced_num_samples_32

# ── Training ──────────────────────────────────────────────────────────────────
# Set in terms of raw MuJoCo interactions — divided by action_repeat automatically.
# action_repeat comes from the task config (e.g. walker=2, cheetah=2).
# action_repeat: 2   # uncomment to override the task default
# MuJoCo step thresholds — o2 phase starts immediately at step 0
mujoco_train_steps:          100000
mujoco_seed_steps:           4000

# ── Planning (CEM) ────────────────────────────────────────────────────────────
iterations: 5
num_samples: 32
num_elites: 8
temperature: 0.5
momentum: 0.1
min_std: 0.05

# ── Learning ──────────────────────────────────────────────────────────────────
lr: 1e-3
batch_size: 512
horizon: 5
discount: 0.99
tau: 0.01                  # target network EMA coefficient
grad_clip_norm: 10


# Loss coefficients
reward_coef: 0.5
value_coef: 0.1
consistency_coef: 2

# ── Architecture ──────────────────────────────────────────────────────────────
enc_dim: 256
mlp_dim: 512
latent_dim: 50

# ── Buffer ────────────────────────────────────────────────────────────────────
max_buffer_size: 1000000
per_alpha: 0.6
per_beta: 0.4

# ── Evaluation & Saving ───────────────────────────────────────────────────────
eval_freq: 20000           # env steps between evaluations
eval_episodes: 0          # set to 0 to disable eval
save_model: false          # save final model + buffer to logs dir

# ── Load pretrained (optional) ────────────────────────────────────────────────
# load_model: /path/to/model.pt
# load_buffer: /path/to/replay_buffer.pth
