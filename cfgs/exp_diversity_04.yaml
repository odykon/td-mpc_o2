exp_name: TDMPC_o2_diversity_Kmeans_init_try2
wandb_notes: "Try of differnt EM init techniques and hyperparamters"

# MuJoCo step thresholds — o2 phase starts immediately at step 0
mujoco_train_steps:          80000
mujoco_seed_steps:           4000
mujoco_decoder_start_steps:  0
mujoco_latent_start_steps:   0

latent_num_samples: 32
latent_num_elites: 8

# Decoder training
decoder_updates:    80
dcem_batch_size:    128
dec_grad_clip_norm: 10
lml_temperature:    20
use_latent_state:   True 
use_raw_obs:       False
decoder_uniform_sampling: False
diversity_coeff:   0.1

latent_action_dim: 128
lambda_gae:        0.5
log_det_target:   -4


gmm_num_samples: 128
gmm_K: 2
gmm_n_iters: 5
gmm_init: 'forgy' # 'kmeans++' (default),