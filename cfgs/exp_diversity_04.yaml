exp_name: TDMPC_o2_diversity_layernorm_on_conditioning
wandb_notes: "Added Layernorm to the state input of the decoder to see if it helps with the scale of the inputs received by the network and the resulting saturation"

# MuJoCo step thresholds — o2 phase starts immediately at step 0
mujoco_train_steps:          80000
mujoco_seed_steps:           4000
mujoco_decoder_start_steps:  0
mujoco_latent_start_steps:   0

latent_num_samples: 32
latent_num_elites: 8

# Decoder training
decoder_updates:    80
dcem_batch_size:    128
dec_grad_clip_norm: 10
lml_temperature:    20
use_latent_state:   True 
use_raw_obs:       False
decoder_uniform_sampling: False
diversity_coeff:   0.05

latent_action_dim: 128
lambda_gae:        0.1


gmm_num_samples: 128
gmm_K: 2
gmm_n_iters: 5
gmm_init: 'kmeans++' # 'kmeans++' (default),
gmm_kmeans_iters: 1