exp_name: o2_diversity_02
wandb_notes: "O2 phased training from scratch, latent CEM from step 0, with learnable entropy coefficient"

# MuJoCo step thresholds — o2 phase starts immediately at step 0
mujoco_train_steps:          40000
mujoco_seed_steps:           4000
mujoco_decoder_start_steps:  0
mujoco_latent_start_steps:   0

# Decoder training
decoder_updates:    70
dcem_batch_size:    128
dec_grad_clip_norm: 1
use_latent_state:   False
use_raw_obs:       True