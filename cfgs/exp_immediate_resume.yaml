# ── Task (set via CLI: task=walker-walk seed=1) ───────────────────────────────
exp_name: o2_immediate_resume

# ── Checkpoint origin ─────────────────────────────────────────────────────────
# mujoco_step_offset must match mujoco_latent_start_steps in the phased run
# so that W&B curves start at the right env_step and overlay correctly.
mujoco_step_offset:  20000
mujoco_resume_steps: 20000

# ── Schedule endpoints (MuJoCo steps) ─────────────────────────────────────────
# Match the phased run so std / horizon schedules are continuous at the boundary.
mujoco_std_schedule_steps:     10000
mujoco_horizon_schedule_steps: 10000

# ── Update cadence ────────────────────────────────────────────────────────────
told_updates:    500
decoder_updates: 100

# ── O2 architecture ───────────────────────────────────────────────────────────
latent_action_dim:   128
decoder_init:        true   # decoder is always initialised fresh (TOLD weights loaded only)
use_latent_state:    true
dcem_batch_size:     64
latent_num_samples:  32
latent_num_elites:   8
lml_temperature:     1

# ── Decoder regularisation ────────────────────────────────────────────────────
saturation_coeff: 0.0
diversity_coeff:  0.0

# ── Evaluation ────────────────────────────────────────────────────────────────
eval_episodes: 3

# ── W&B ───────────────────────────────────────────────────────────────────────
wandb_project: TDMPC_O2
wandb_entity:  odysseaskon-national-technical-university-of-athens
