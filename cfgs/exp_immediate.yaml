# ── Task (set via CLI: task=walker-walk seed=1) ───────────────────────────────
exp_name: o2_immediate

# ── MuJoCo step thresholds ────────────────────────────────────────────────────
# All divided by action_repeat automatically in load_cfg.
# Decoder + latent CEM start immediately after seed — no warmup phase.
mujoco_train_steps: 40000
mujoco_seed_steps:  0       # buffer is pre-loaded; skip random exploration

# ── Schedule endpoints (MuJoCo steps) ─────────────────────────────────────────
mujoco_std_schedule_steps:     10000
mujoco_horizon_schedule_steps: 10000

# ── Update cadence ────────────────────────────────────────────────────────────
told_updates:    500   # TOLD gradient updates per episode (after seed)
decoder_updates: 100   # decoder gradient updates per episode (after seed)

# ── O2 architecture ───────────────────────────────────────────────────────────
latent_action_dim:   128
decoder_init:        orthogonal
use_latent_state:    true
dcem_batch_size:     64
latent_num_samples:  32
latent_num_elites:   8
lml_temperature:     1

# ── Decoder regularisation ────────────────────────────────────────────────────
saturation_coeff: 0.0
diversity_coeff:  0.0

# ── Evaluation ────────────────────────────────────────────────────────────────
eval_episodes: 3   # single final evaluation with video

# ── W&B ───────────────────────────────────────────────────────────────────────
wandb_project: TDMPC_O2
wandb_entity:  odysseaskon-national-technical-university-of-athens
